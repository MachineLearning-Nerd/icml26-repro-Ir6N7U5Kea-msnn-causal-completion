<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
  <title id="title">Full-scale mixed-anchor mechanism test</title>
  <desc id="desc">All selected cliques satisfy invariants, all corrupted controls are rejected, and violating the shared-factor assumption increases error 638-fold.</desc>
  <rect width="960" height="500" fill="#fbfaf7"/>
  <text x="70" y="48" font-family="sans-serif" font-size="25" font-weight="700" fill="#17233c">The mixed-anchor mechanism survives noise and paper scale</text>
  <text x="70" y="78" font-family="sans-serif" font-size="15" fill="#536178">300×100, rank 3, relative noise 0.001, 10 seeds, 400 target searches</text>
  <rect x="90" y="125" width="230" height="145" rx="14" fill="#e5f2ef" stroke="#4f9f8f"/>
  <text x="205" y="174" text-anchor="middle" font-family="sans-serif" font-size="38" font-weight="700" fill="#37796d">382/382</text>
  <text x="205" y="208" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#263248">selected cliques pass</text><text x="205" y="231" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#263248">every invariant</text>
  <rect x="365" y="125" width="230" height="145" rx="14" fill="#fbe9e5" stroke="#e05a47"/>
  <text x="480" y="174" text-anchor="middle" font-family="sans-serif" font-size="38" font-weight="700" fill="#b13b2b">382/382</text>
  <text x="480" y="208" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#263248">corrupted-edge</text><text x="480" y="231" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#263248">controls rejected</text>
  <rect x="640" y="125" width="230" height="145" rx="14" fill="#edf0f5" stroke="#65758b"/>
  <text x="755" y="174" text-anchor="middle" font-family="sans-serif" font-size="38" font-weight="700" fill="#445064">26</text>
  <text x="755" y="208" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#263248">genuinely mixed-treatment</text><text x="755" y="231" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#263248">cliques (6.806%)</text>
  <text x="90" y="323" font-family="sans-serif" font-size="17" font-weight="700" fill="#263248">Scaled MAE on 215 estimable targets</text>
  <rect x="90" y="350" width="2" height="46" fill="#4f9f8f"/><text x="105" y="381" font-family="sans-serif" font-size="17" fill="#37796d">Shared row factor: 0.003497</text>
  <rect x="90" y="415" width="720" height="46" fill="#e05a47"/><text x="820" y="445" font-family="sans-serif" font-size="17" fill="#b13b2b">Violated: 2.232891</text>
  <text x="480" y="488" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#536178">Breaking Assumption 2.5 raises error by 638.4×—a control that fails for the intended reason.</text>
</svg>
