<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Paper Tables 2 and 3 feasible rates</title>
  <desc id="desc">Grouped bars compare SNN and MSNN feasible percentages for two lambda values and three treatments.</desc>
  <rect width="960" height="540" fill="#fbfaf7"/>
  <text x="70" y="45" font-family="sans-serif" font-size="25" font-weight="700" fill="#17233c">The imported MNAR range claim contradicts the paper’s own tables</text>
  <text x="70" y="75" font-family="sans-serif" font-size="15" fill="#536178">Feasible rate (%) across λ and treatment level · exact values from Tables 2–3</text>
  <line x1="80" y1="450" x2="920" y2="450" stroke="#8c96a6"/>
  <line x1="80" y1="370" x2="920" y2="370" stroke="#d9dee7"/>
  <line x1="80" y1="290" x2="920" y2="290" stroke="#d9dee7"/>
  <line x1="80" y1="210" x2="920" y2="210" stroke="#d9dee7"/>
  <line x1="80" y1="130" x2="920" y2="130" stroke="#d9dee7"/>
  <g font-family="sans-serif" font-size="13" fill="#536178" text-anchor="end">
    <text x="70" y="455">0</text><text x="70" y="375">15</text><text x="70" y="295">30</text><text x="70" y="215">45</text><text x="70" y="135">60</text>
  </g>
  <g fill="#65758b">
    <rect x="115" y="448.99" width="34" height="1.01"/><rect x="245" y="447.97" width="34" height="2.03"/><rect x="375" y="427.76" width="34" height="22.24"/>
    <rect x="525" y="398.96" width="34" height="51.04"/><rect x="655" y="387.60" width="34" height="62.40"/><rect x="785" y="329.15" width="34" height="120.85"/>
  </g>
  <g fill="#e05a47">
    <rect x="151" y="433.31" width="34" height="16.69"/><rect x="281" y="432.61" width="34" height="17.39"/><rect x="411" y="425.89" width="34" height="24.11"/>
    <rect x="561" y="306.21" width="34" height="143.79"/><rect x="691" y="269.31" width="34" height="180.69"/><rect x="821" y="161.15" width="34" height="288.85"/>
  </g>
  <g font-family="sans-serif" font-size="12" text-anchor="middle">
    <g fill="#445064"><text x="132" y="441">0.19</text><text x="262" y="440">0.38</text><text x="392" y="419">4.17</text><text x="542" y="390">9.57</text><text x="672" y="379">11.70</text><text x="802" y="321">22.66</text></g>
    <g fill="#b13b2b" font-weight="700"><text x="168" y="425">3.13</text><text x="298" y="424">3.26</text><text x="428" y="418">4.52</text><text x="578" y="298">26.96</text><text x="708" y="261">33.88</text><text x="838" y="153">54.16</text></g>
  </g>
  <g font-family="sans-serif" font-size="13" fill="#263248" text-anchor="middle">
    <text x="150" y="478">λ=.05 low</text><text x="280" y="478">λ=.05 med</text><text x="410" y="478">λ=.05 high</text>
    <text x="560" y="478">λ=.02 low</text><text x="690" y="478">λ=.02 med</text><text x="820" y="478">λ=.02 high</text>
  </g>
  <rect x="660" y="92" width="16" height="16" fill="#65758b"/><text x="683" y="105" font-family="sans-serif" font-size="14" fill="#263248">SNN</text>
  <rect x="740" y="92" width="16" height="16" fill="#e05a47"/><text x="763" y="105" font-family="sans-serif" font-size="14" fill="#263248">MSNN</text>
  <text x="480" y="520" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#536178">MSNN is better in every cell, but its range is 3.13–54.16%, and SNN reaches 22.66%.</text>
</svg>
